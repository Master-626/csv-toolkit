name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
            minimum-dependencies: true
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Check minimum dependency versions
        if: matrix.minimum-dependencies
        run: python -m pip install "click==8.0.0" "pytest==7.0.0"
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: python -m pip install build "ruff>=0.6.0"
      - name: Lint
        run: ruff check .
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke-test installed wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/csv-toolkit --version
