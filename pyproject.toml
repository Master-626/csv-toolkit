[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-toolkit"
version = "0.1.1"
description = "Merge, split, filter, sort, and convert CSV files without overwriting existing outputs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["csv", "data", "spreadsheet", "merge", "filter", "sort", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
csv-toolkit = "csv_toolkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = [
    # zip(strict=...) is not available on Python 3.8.
    "B905",
    # Split cleanup keeps the publish error as implicit exception context.
    "B904",
]

[project.urls]
Homepage = "https://github.com/Master-626/csv-toolkit"
Repository = "https://github.com/Master-626/csv-toolkit"
Issue-Tracker = "https://github.com/Master-626/csv-toolkit/issues"
