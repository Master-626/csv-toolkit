[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-toolkit"
version = "0.1.0"
description = "A powerful CSV data processing toolkit - merge, split, filter, sort, convert formats"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["csv", "data", "spreadsheet", "merge", "filter", "sort", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
csv-toolkit = "csv_toolkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/csv-toolkit"
Repository = "https://github.com/Master-626/csv-toolkit"
Issue-Tracker = "https://github.com/Master-626/csv-toolkit/issues"
